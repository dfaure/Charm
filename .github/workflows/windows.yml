name: Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Qt 5.15 / MSVC x64
    runs-on: windows-2022

    env:
      QTKEYCHAIN_TAG: v0.14.0
      QTKEYCHAIN_PREFIX: ${{ github.workspace }}/qtkeychain-install

    steps:
      - uses: actions/checkout@v4
        with:
          # the top-level CMakeLists runs "git describe --tags" for the version,
          # so it needs the tag and the history back to it
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache QtKeychain
        id: cache-qtkeychain
        uses: actions/cache@v4
        with:
          path: ${{ env.QTKEYCHAIN_PREFIX }}
          key: qtkeychain-${{ env.QTKEYCHAIN_TAG }}-qt5.15.2-msvc-x64

      - name: Build QtKeychain
        if: steps.cache-qtkeychain.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $env:QTKEYCHAIN_TAG https://github.com/frankosterfeld/qtkeychain.git
          cmake -S qtkeychain -B qtkeychain/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_WITH_QT6=OFF `
            -DBUILD_TEST_APPLICATION=OFF `
            -DBUILD_TRANSLATIONS=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:QTKEYCHAIN_PREFIX"
          cmake --build qtkeychain/build
          cmake --install qtkeychain/build

      - name: Configure
        # not "build": the repo has a top-level BUILD file, and the Windows
        # filesystem is case-insensitive
        run: |
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QTKEYCHAIN_PREFIX"

      - name: Build
        run: cmake --build build-ci

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
